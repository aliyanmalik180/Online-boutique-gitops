# 1 control-plane + 2 workers. Ports 80/443 of the control-plane node are
# published on the host as 8080/8443, so the store opens at http://localhost:8080
# (ingress-nginx's kind manifest binds hostPort 80/443 on the node labelled
# ingress-ready=true).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
