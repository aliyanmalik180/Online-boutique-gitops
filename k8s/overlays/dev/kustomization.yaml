apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boutique-dev

resources:
  - ../../base

# The CI pipeline rewrites newName and newTag below on every push to main.
# Until the first pipeline run completes this points at the upstream image,
# so the first ArgoCD sync works before anything has been built.
images:
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend
    newTag: v0.10.7

patches:
  # kind has no cloud load balancer, traffic enters through the Ingress.
  - path: remove-lb-service.yaml
  # Small synthetic load so Grafana has something to show without hogging the PC.
  - path: loadgenerator-light.yaml
  # To turn the load generator OFF completely, uncomment the next line:
  # - path: loadgenerator-off.yaml
