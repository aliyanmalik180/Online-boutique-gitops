name: pr-checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: src/frontend/go.mod
          cache-dependency-path: src/frontend/go.sum

      - name: Unit tests (Go)
        working-directory: src/frontend
        run: |
          go test ./... -race -count=1

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build image (no push)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: src/frontend
          load: true
          push: false
          tags: online-boutique-frontend:pr
          cache-from: type=gha

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: online-boutique-frontend:pr
          version: v0.69.3
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Render both overlays (fails on invalid Kustomize)
        run: |
          kubectl kustomize k8s/overlays/dev  > /dev/null
          kubectl kustomize k8s/overlays/prod > /dev/null
      - name: No floating image tags allowed
        run: |
          if kubectl kustomize k8s/overlays/dev | grep -E 'image: .*(:latest|:alpine)$|image: [^:]+$'; then
            echo "::error::floating image tag found"; exit 1
          fi
