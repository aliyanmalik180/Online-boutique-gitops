name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'argocd/**'
      - 'monitoring/**'
      - 'docs/**'
      - '**.md'

# One run at a time per branch, so the manifest commit-back never races itself.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # commit the new image tag back to the repo
  packages: write   # push to GHCR

env:
  IMAGE_NAME: online-boutique-frontend

# Every third-party action is pinned to a full commit SHA (not a mutable tag).
# Reason: in March 2026 most trivy-action tags were hijacked to steal secrets.
jobs:
  build-scan-push-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: src/frontend/go.mod
          cache-dependency-path: src/frontend/go.sum

      - name: Unit tests (Go)
        working-directory: src/frontend
        run: |
          go test ./... -race -count=1

      - name: Compute image name and tag
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"            # GHCR requires lowercase
          echo "name=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}"                  >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (local only, for scanning)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: src/frontend
          load: true
          push: false
          tags: ${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.tag }}
          version: v0.69.3          # known-safe Trivy binary version
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: src/frontend
          push: true
          tags: ${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha

      - name: Point the dev overlay at the new image
        run: |
          f=k8s/overlays/dev/kustomization.yaml
          sed -i -E "s|^( *newName:).*|\1 ${{ steps.meta.outputs.name }}|; s|^( *newTag:).*|\1 ${{ steps.meta.outputs.tag }}|" "$f"
          git diff --stat
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "deploy(dev): frontend ${{ steps.meta.outputs.tag }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
