name: promote-to-prod

# Manual: copies the image currently running in dev into the prod overlay.
# ArgoCD's prod Application is manual-sync, so a human still presses Sync.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Copy image reference dev -> prod
        run: |
          name=$(grep -E '^ *newName:' k8s/overlays/dev/kustomization.yaml | head -1 | awk '{print $2}')
          tag=$(grep  -E '^ *newTag:'  k8s/overlays/dev/kustomization.yaml | head -1 | awk '{print $2}')
          sed -i -E "s|^( *newName:).*|\1 ${name}|; s|^( *newTag:).*|\1 ${tag}|" k8s/overlays/prod/kustomization.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "promote(prod): frontend ${tag}" || { echo "nothing to promote"; exit 0; }
          git push origin HEAD:main
